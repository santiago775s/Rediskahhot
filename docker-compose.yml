services:
  web:
    build: .
    container_name: votacion-en-vivo
    ports:
      - "${APP_PORT:-8078}:8078"
    env_file:
      - .env
    networks:
      - mongo
      - redis
    restart: unless-stopped

networks:
  mongo:
    external: true
    name: ${DOCKER_MONGO_NETWORK:-bd-mongo_default}
  redis:
    external: true
    name: ${DOCKER_REDIS_NETWORK:-bd-redis-docker_default}
